name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 8feb4494feac08c8e9f442f82db6144a865ffbe1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraStaff v0.1.0
          target_commitish: 8feb4494feac08c8e9f442f82db6144a865ffbe1
          body: Initial MiraStaff release with staff mode, vanish, freeze, inventory inspection, staff teleport, staff chat and public API. MiraFly remains sole flight authority.
          files: build/libs/MiraStaff-0.1.0.jar
